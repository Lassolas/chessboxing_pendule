<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pendule Chessboxing</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pendule CB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── ACCUEIL ── -->
<section id="setup">
  <h1 class="setup-head">PENDULE <span class="gold">CHESSBOXING</span></h1>

  <div class="resume-wrap" id="resume-wrap" hidden>
    <button type="button" id="btn-resume-saved" class="btn btn-gold wide resume-live"></button>
    <button type="button" id="btn-drop-saved" class="resume-x" aria-label="Effacer la partie">✕</button>
  </div>

  <div class="presets" id="presets"></div>
  <div class="durations" id="durations"></div>
  <div class="chess-set" id="chess-set"></div>
  <button type="button" id="btn-reset" class="reset-link">↺ Réinitialiser</button>

  <div class="options" id="options"></div>
  <p class="opt-help" id="opt-help" hidden></p>

  <details class="advanced">
    <summary>⚙ Réglages</summary>
    <div class="names">
      <label><span>▼</span><input id="name-0" maxlength="20" placeholder="Joueur 1"></label>
      <label><span>▲</span><input id="name-1" maxlength="20" placeholder="Joueur 2"></label>
    </div>
    <div class="set-actions">
    <button type="button" id="btn-test-sound" class="btn btn-ghost wide">🔔 Test son</button>
    <button type="button" id="btn-defaults" class="btn btn-ghost wide">↺ Défaut</button>
    </div>
  </details>

  <div id="install-box" class="install" hidden>
    <button type="button" id="btn-install" class="btn btn-blue wide" hidden>Installer</button>
    <p id="install-ios" class="muted small" hidden>iPhone : <b>Partager</b> → <b>Sur l'écran d'accueil</b></p>
  </div>
  <p class="muted small version" id="version"></p>
</section>

<!-- ── COMBAT ── -->
<section id="fight" hidden>
  <div class="half top" data-p="1"></div>
  <div class="bar">
    <button type="button" class="bar-home" id="bar-home" aria-label="Accueil">⌂</button>
    <div class="bar-info">
      <div class="bar-round" id="bar-round">Round 1/7</div>
      <div class="bar-phase" id="bar-phase">Échecs</div>
    </div>
    <div class="bar-timer" id="bar-timer">3:00</div>
    <button type="button" class="bar-btn" id="bar-btn">PAUSE</button>
  </div>
  <div class="half bottom" data-p="0"></div>
</section>

<!-- ── MENU PAUSE ── -->
<div id="pause-menu" class="overlay" hidden>
  <div class="panel">
    <button type="button" class="btn btn-gold wide pm-go" id="pm-resume">▶ CONTINUER</button>
    <button type="button" class="btn wide pm-next" id="pm-next">♟ Round 3 ▶</button>
    <div class="pm-row">
      <button type="button" class="btn" id="pm-restart" aria-label="Recommencer à zéro">↺ Rejouer</button>
      <button type="button" class="btn" id="pm-home" aria-label="Accueil">⌂ Accueil</button>
    </div>
  </div>
</div>

<!-- ── FIN DE COMBAT MANUELLE ── -->
<div id="end-menu" class="overlay" hidden>
  <div class="panel">
    <h2>Vainqueur ?</h2>
    <div class="choice" id="end-winner"></div>
    <div class="choice" id="end-method"></div>
    <button type="button" class="btn btn-gold wide big" id="end-ok" disabled>OK</button>
    <button type="button" class="btn btn-ghost wide" id="end-cancel">←</button>
  </div>
</div>

<!-- ── RÉSULTAT ── -->
<div id="result" class="overlay" hidden>
  <div class="panel">
    <p class="result-kicker" id="res-kicker">VICTOIRE</p>
    <h2 class="result-name" id="res-name"></h2>
    <p class="result-method" id="res-method"></p>
    <button type="button" class="btn btn-gold wide" id="res-decide">Vainqueur ?</button>
    <button type="button" class="btn btn-ghost wide" id="res-new">⌂</button>
  </div>
</div>

<div id="flash"></div>

<script type="module" src="app.js"></script>
</body>
</html>
